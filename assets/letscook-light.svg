<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" fill="none" role="img" aria-labelledby="title"><title id="title">Let&#x27;s Cook: A student-run tech community. Beginner-first, open to every college in India. — Founder &amp; Executive Chairman</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}@keyframes steam{0%{transform:translateY(6px);opacity:0}40%{opacity:.9}100%{transform:translateY(-14px);opacity:0}}.st{animation:steam 2.6s ease-in-out infinite}@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}.fl{transform-box:fill-box;transform-origin:bottom;animation:flick 1.1s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}.gl{animation:glow 3s ease-in-out infinite}</style><defs><clipPath id="lc"><rect width="1000" height="360" rx="20"/></clipPath></defs><rect x=".5" y=".5" width="999" height="359" rx="20" fill="#ffffff" stroke="#d8dee4"/><defs><radialGradient id="lg"><stop offset="0" stop-color="#b45309" stop-opacity=".22"/><stop offset="1" stop-color="#b45309" stop-opacity="0"/></radialGradient></defs><g clip-path="url(#lc)"><circle class="gl" cx="900" cy="40" r="300" fill="url(#lg)"/></g><rect x="56" y="52" width="64" height="64" rx="18" fill="#b45309" fill-opacity=".14" stroke="#b45309" stroke-opacity=".4"/><path class="st" style="animation-delay:0.0s" d="M78,78 q-4,-5 0,-10 q4,-5 0,-10" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><path class="st" style="animation-delay:0.5s" d="M88,78 q-4,-5 0,-10 q4,-5 0,-10" stroke="#b45309" stroke-width="2" stroke-linecap="round"/><path class="st" style="animation-delay:1