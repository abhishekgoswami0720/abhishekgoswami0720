<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none" role="img" aria-labelledby="title"><title id="title">InReal: Searches internships across 23 job sites at once and runs every posting through an AI scam check before you ever see it.</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(680px)}}.sw{animation:sweep 5s cubic-bezier(.45,0,.55,1) infinite}@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}.eq{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite}@keyframes tick{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.tick{stroke-dasharray:1;animation:tick 1.2s .4s ease-out both}@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 9s linear infinite}@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}.bar{transform-box:fill-box;transform-origin:bottom;animation:bar .8s cubic-bezier(.2,.7,.2,1) both}@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}.ping{animation:ping 1.8s ease-out infinite}</style><defs><clipPath id="pc"><rect width="480" height="240" rx="16"/></clipPath></defs><rect x=".5" y=".5" width="479" height="239" rx="16" fill="#0f1621" stroke="#223044"/><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset=".5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#pc)"><rect class="sw" x="0" y="0" width="200" height="2.5" fill="url(#sg)"/></g><rect x="24" y="24" width="44" height="44" rx="12" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".35"/><path d="M46,34 l1