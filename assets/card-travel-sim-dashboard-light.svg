<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none" role="img" aria-labelledby="title"><title id="title">Travel SIM Dashboard: Sales analytics for Travel SIM orders: order trends, KPI cards and a staff leaderboard, all served from a single Postgres function.</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(680px)}}.sw{animation:sweep 5s cubic-bezier(.45,0,.55,1) infinite}@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}.eq{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite}@keyframes tick{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.tick{stroke-dasharray:1;animation:tick 1.2s .4s ease-out both}@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 9s linear infinite}@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}.bar{transform-box:fill-box;transform-origin:bottom;animation:bar .8s cubic-bezier(.2,.7,.2,1) both}@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}.ping{animation:ping 1.8s ease-out infinite}</style><defs><clipPath id="pc"><rect width="480" height="240" rx="16"/></clipPath></defs><rect x=".5" y=".5" width="479" height="239" rx="16" fill="#ffffff" stroke="#d8dee4"/><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#b45309" stop-opacity="0"/><stop offset=".5" stop-color="#b45309"/><stop offset="1" stop-color="#b45309" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#pc)"><rect class="sw" x="0" y="0" width="200" height="2.5" fill="url(#sg)"/></g><rect x="24" y="24" width="44" height="44" rx="12" fill="#b45309" fill-opacity=".12" stroke="#b45309" stroke-opacity=".35"/><rect class="bar" x="35.0" y="48.0" width="4" height="8" rx="1.2" fill="#b45309" style="animation-delay:0.20s"/><rect class="bar" x="41.0" y="42.0" width="4" height="14" rx="1.2" fill="#b45309" style="animation-delay:0.32s"/><rect class="bar" x="47.0" y="45.0" width="4" height="11" rx="1.2" fill="#b45309" style="animation-delay:0.44s"/><rect class="bar" x="53.0" y="36.0" width="4" height="20" rx="1.2" fill="#b45309" style="animation-delay:0.56s"/><text class="s" x="84" y="44" font-size="20" font-weight="700" fill="#1f2328">Travel SIM Dashboard</text><rect x="84" y="53" width="80.1" height="20" rx="10" fill="#b45309" fill-opacity=".12"/><text class="m" x="124.0" y="67" font-size="11.5" fill="#b45309" text-anchor="middle">analytics</text><circle class="ping" cx="410" cy="40" r="4" fill="#0f766e" style="transform-origin:410px 40px"/><circle cx="410" cy="40" r="4" fill="#0f766e"/><text class="m" x="456" y="44.5" font-size="12.5" fill="#0f766e" text-anchor="end">live</text><text class="s" x="24" y="110" font-size="14.5" fill="#57606a">Sales analytics for Travel SIM orders: order trends, KPI cards</text><text class="s" x="24" y="132" font-size="14.5" fill="#57606a">and a staff leaderboard, all served from a single Postgres</text><text class="s" x="24" y="154" font-size="14.5" fill="#57606a">function.</text><rect x="24" y="190" width="77.6" height="26" rx="13" fill="#f6f8fa" stroke="#d8dee4"/><text class="m" x="62.8" y="207.5" font-size="12" fill="#57606a" text-anchor="middle">Supabase</text><rect x="109.6" y="190" width="92.0" height="26" rx="13" fill="#f6f8fa" stroke="#d8dee4"/><text class="m" x="155.6" y="207.5" font-size="12" fill="#57606a" text-anchor="middle">PostgreSQL</text><rect x="209.6" y="190" width="77.6" height="26" rx="13" fill="#f6f8fa" stroke="#d8dee4"/><text class="m" x="248.4" y="207.5" font-size="12" fill="#57606a" text-anchor="middle">Chart.js</text></svg>