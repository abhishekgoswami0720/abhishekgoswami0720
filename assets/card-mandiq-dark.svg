<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none" role="img" aria-labelledby="title"><title id="title">MandiQ: Voice-first procurement slot booking for farmers. Call an IVR line in your own language to book or check a mandi slot, no smartphone needed.</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(680px)}}.sw{animation:sweep 5s cubic-bezier(.45,0,.55,1) infinite}@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}.eq{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite}@keyframes tick{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.tick{stroke-dasharray:1;animation:tick 1.2s .4s ease-out both}@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 9s linear infinite}@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}.bar{transform-box:fill-box;transform-origin:bottom;animation:bar .8s cubic-bezier(.2,.7,.2,1) both}@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}.ping{animation:ping 1.8s ease-out infinite}</style><defs><clipPath id="pc"><rect width="480" height="240" rx="16"/></clipPath></defs><rect x=".5" y=".5" width="479" height="239" rx="16" fill="#0f1621" stroke="#223044"/><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#f5a524" stop-opacity="0"/><stop offset=".5" stop-color="#f5a524"/><stop offset="1" stop-color="#f5a524" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#pc)"><rect class="sw" x="0" y="0" width="200" height="2.5" fill="url(#sg)"/></g><rect x="24" y="24" width="44" height="44" rx="12" fill="#f5a524" fill-opacity=".12" stroke="#f5a524" stroke-opacity=".35"/><rect class="eq" x="34.0" y="42.0" width="3" height="8" rx="1.5" fill="#f5a524" style="animation-delay:0.00s"/><rect class="eq" x="39.5" y="38.0" width="3" height="16" rx="1.5" fill="#f5a524" style="animation-delay:0.13s"/><rect class="eq" x="45.0" y="35.0" width="3" height="22" rx="1.5" fill="#f5a524" style="animation-delay:0.26s"/><rect class="eq" x="50.5" y="39.0" width="3" height="14" rx="1.5" fill="#f5a524" style="animation-delay:0.39s"/><rect class="eq" x="56.0" y="41.5" width="3" height="9" rx="1.5" fill="#f5a524" style="animation-delay:0.52s"/><text class="s" x="84" y="44" font-size="20" font-weight="700" fill="#e6edf3">MandiQ</text><rect x="84" y="53" width="156.0" height="20" rx="10" fill="#f5a524" fill-opacity=".12"/><text class="m" x="162.0" y="67" font-size="11.5" fill="#f5a524" text-anchor="middle">SIH 2026 · team lead</text><circle class="ping" cx="410" cy="40" r="4" fill="#2dd4bf" style="transform-origin:410px 40px"/><circle cx="410" cy="40" r="4" fill="#2dd4bf"/><text class="m" x="456" y="44.5" font-size="12.5" fill="#2dd4bf" text-anchor="end">live</text><text class="s" x="24" y="110" font-size="14.5" fill="#9aa7b8">Voice-first procurement slot booking for farmers. Call an IVR</text><text class="s" x="24" y="132" font-size="14.5" fill="#9aa7b8">line in your own language to book or check a mandi slot, no</text><text class="s" x="24" y="154" font-size="14.5" fill="#9aa7b8">smartphone needed.</text><rect x="24" y="190" width="70.4" height="26" rx="13" fill="#141d2b" stroke="#223044"/><text class="m" x="59.2" y="207.5" font-size="12" fill="#9aa7b8" text-anchor="middle">FastAPI</text><rect x="102.4" y="190" width="56.0" height="26" rx="13" fill="#141d2b" stroke="#223044"/><text class="m" x="130.4" y="207.5" font-size="12" fill="#9aa7b8" text-anchor="middle">React</text><rect x="166.4" y="190" width="92.0" height="26" rx="13" fill="#141d2b" stroke="#223044"/><text class="m" x="212.4" y="207.5" font-size="12" fill="#9aa7b8" text-anchor="middle">WebSockets</text><rect x="266.4" y="190" width="56.0" height="26" rx="13" fill="#141d2b" stroke="#223044"/><text class="m" x="294.4" y="207.5" font-size="12" fill="#9aa7b8" text-anchor="middle">Voice</text></svg>