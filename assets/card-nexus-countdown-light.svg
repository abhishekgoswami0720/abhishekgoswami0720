<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none" role="img" aria-labelledby="title"><title id="title">NEXUS Countdown: A cinematic countdown experience rendered in real-time 3D, with choreographed camera and UI motion.</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(680px)}}.sw{animation:sweep 5s cubic-bezier(.45,0,.55,1) infinite}@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}.eq{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite}@keyframes tick{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.tick{stroke-dasharray:1;animation:tick 1.2s .4s ease-out both}@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 9s linear infinite}@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}.bar{transform-box:fill-box;transform-origin:bottom;animation:bar .8s cubic-bezier(.2,.7,.2,1) both}@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}.ping{animation:ping 1.8s ease-out infinite}</style><defs><clipPath id="pc"><rect width="480" height="240" rx="16"/></clipPath></defs><rect x=".5" y=".5" width="479" height="239" rx="16" fill="#ffffff" stroke="#d8dee4"/><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#be123c" stop-opacity="0"/><stop offset=".5" stop-color="#be123c"/><stop offset="1" stop-color="#be123c" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#pc)"><rect class="sw" x="0" y="0" width="200" height="2.5" fill="url(#sg)"/></g><rect x="24" y="24" width="44" height="44" rx="12" fill="#be123c" fill-opacity=".12" stroke="#be123c" stroke-opacity=".35"/><circle cx="46" cy="46" r="4.5" fill="#be123c"/><g class="spin" style="transform-origin:46px 46px"><ellipse cx="46" cy="46" rx="13" ry="5.5" stroke="#be123c" stroke-width="1.6" transform="rotate(-25 46 46)"/><circle cx="57.8" cy="40.6" r="2.2" fill="#be123c"/></g><text class="s" x="84" y="44" font-size="20" font-weight="700" fill="#1f2328">NEXUS Countdown</text><rect x="84" y="53" width="93.9" height="20" rx="10" fill="#be123c" fill-opacity=".12"/><text class="m" x="130.9" y="67" font-size="11.5" fill="#be123c" text-anchor="middle">3D · motion</text><text class="s" x="24" y="110" font-size="14.5" fill="#57606a">A cinematic countdown experience rendered in real-time 3D,</text><text class="s" x="24" y="132" font-size="14.5" fill="#57606a">with choreographed camera and UI motion.</text><rect x="24" y="190" width="56.0" height="26" rx="13" fill="#f6f8fa" stroke="#d8dee4"/><text class="m" x="52.0" y="207.5" font-size="12" fill="#57606a" text-anchor="middle">React</text><rect x="88.0" y="190" width="92.0" height="26" rx="13" fill="#f6f8fa" stroke="#d8dee4"/><text class="m" x="134.0" y="207.5" font-size="12" fill="#57606a" text-anchor="middle">TypeScript</text><rect x="188.0" y="190" width="77.6" height="26" rx="13" fill="#f6f8fa" stroke="#d8dee4"/><text class="m" x="226.8" y="207.5" font-size="12" fill="#57606a" text-anchor="middle">Three.js</text><rect x="273.6" y="190" width="48.8" height="26" rx="13" fill="#f6f8fa" stroke="#d8dee4"/><text class="m" x="298.0" y="207.5" font-size="12" fill="#57606a" text-anchor="middle">GSAP</text></svg>